<!-- THE TAB ICON, AND THE ONE SHE GETS IF SHE SAVES THIS TO HER HOME
     SCREEN. Nothing was declared, so every browser guessed /favicon.ico
     and 404ed on it — Steven's console, 10 Sep.

     An inline SVG rather than a file: it is the brand mark that is
     already at the top of the page, it costs no request, and there is no
     asset to lose. Replace with a real file if you want photographic
     detail; for a rounded square with two letters this is sharper at
     every size than an .ico could be. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E4703A'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='bold' fill='%23fff' text-anchor='middle'%3EG%3C/text%3E%3C/svg%3E">

<header class="topbar">
  <div class="brand">
    <!-- THE LANGUAGE SWITCH. Was a static `DE` tile — the site's logo
         mark and nothing else, which made it look tappable while doing
         nothing. Steven, 09 Sep: "swap the DE button at the top to be the
         toggle for language and get rid of Eng -> Germ pill."
         app.js fills it: target on top, her own language under. -->
    <button class="brand-mark" id="brandmark" type="button"></button>
    <span class="brand-text">
      <strong>Deutsch für Tanya</strong>
      <em data-i18n="tagline"></em>
    </span>
  </div>
  <div class="topbar-controls">
  <nav class="themeswitch" id="themeswitch" aria-label="Color theme"></nav>
  <!-- The `Рус → Нем` pill lived here. Gone, 09 Sep — the brand mark at
       the top left is the language switch now and does everything the
       pill did. `initLangSwitch` in app.js still falls back to a
       `#langswitch` element if it finds one, so an older copy of this
       file keeps working; there just is not one any more. -->
  </div>
</header>
